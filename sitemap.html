<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sitemap | Wach Saif</title>
<meta name="description" content="Full page list for wachsaif.github.io - Wach Saif's freelance web, design and SEO portfolio site.">
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --text: #eaeaea;
    --muted: #9aa0aa;
    --accent: #6ee7b7;
    --border: #262a33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 48px 20px;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 4px;
  }
  .sub {
    color: var(--muted);
    margin-bottom: 32px;
    font-size: 15px;
  }
  .group {
    margin-bottom: 28px;
  }
  .group h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 12px;
    font-weight: 600;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--card);
  }
  li {
    border-bottom: 1px solid var(--border);
  }
  li:last-child {
    border-bottom: none;
  }
  a {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 18px;
    color: var(--text);
    text-decoration: none;
    font-size: 15px;
  }
  a:hover {
    background: #1d212b;
    color: var(--accent);
  }
  a .path {
    color: var(--muted);
    font-size: 13px;
  }
  footer {
    margin-top: 36px;
    color: var(--muted);
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Sitemap</h1>
  <p class="sub">All pages on wachsaif.github.io</p>

  <div class="group">
    <h2>Main pages</h2>
    <ul>
      <li><a href="https://wachsaif.github.io/">Home <span class="path">/</span></a></li>
      <li><a href="https://wachsaif.github.io/service.html">Service <span class="path">/service.html</span></a></li>
      <li><a href="https://wachsaif.github.io/portfolio.html">Portfolio <span class="path">/portfolio.html</span></a></li>
      <li><a href="https://wachsaif.github.io/about.html">About <span class="path">/about.html</span></a></li>
      <li><a href="https://wachsaif.github.io/hire.html">Hire Me <span class="path">/hire.html</span></a></li>
    </ul>
  </div>

  <footer>
    Generated for wachsaif.github.io — update this file whenever a new page is added to the site.
  </footer>
</div>
</body>
</html>
