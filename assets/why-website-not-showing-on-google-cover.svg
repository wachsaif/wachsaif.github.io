<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="covTitle covDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="covTitle">Why is my website not showing up on Google</title>
  <desc id="covDesc">Illustration of a browser window with a search bar and a magnifying glass, symbolizing a website search ranking and Google indexing problem</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34007D"/>
      <stop offset="55%" stop-color="#6300CD"/>
      <stop offset="100%" stop-color="#1B0A3F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E0C6"/>
      <stop offset="100%" stop-color="#00A896"/>
    </linearGradient>
    <radialGradient id="orbGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E0C6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00E0C6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <circle cx="980" cy="120" r="220" fill="url(#orbGrad)" filter="url(#soft)"/>
  <circle cx="140" cy="540" r="180" fill="url(#orbGrad)" filter="url(#soft)"/>

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Browser window -->
  <g transform="translate(300,150)">
    <rect x="0" y="0" width="600" height="360" rx="20" fill="#FAF8FF" opacity="0.98"/>
    <rect x="0" y="0" width="600" height="56" rx="20" fill="#F1ECFB"/>
    <rect x="0" y="36" width="600" height="20" fill="#F1ECFB"/>
    <circle cx="30" cy="28" r="7" fill="#FF5F57"/>
    <circle cx="54" cy="28" r="7" fill="#FEBC2E"/>
    <circle cx="78" cy="28" r="7" fill="#28C840"/>

    <!-- search bar -->
    <rect x="120" y="16" width="440" height="24" rx="12" fill="#FFFFFF" stroke="#DCD4EF" stroke-width="1.5"/>
    <circle cx="140" cy="28" r="6" fill="none" stroke="#8A7FA8" stroke-width="2"/>
    <line x1="144.5" y1="32.5" x2="150" y2="38" stroke="#8A7FA8" stroke-width="2" stroke-linecap="round"/>

    <!-- greyed-out result rows to suggest "not appearing" -->
    <rect x="40" y="100" width="230" height="14" rx="4" fill="#D8CFEE"/>
    <rect x="40" y="126" width="340" height="10" rx="4" fill="#E7E1F5"/>
    <rect x="40" y="144" width="300" height="10" rx="4" fill="#E7E1F5"/>

    <rect x="40" y="184" width="190" height="14" rx="4" fill="#D8CFEE"/>
    <rect x="40" y="210" width="360" height="10" rx="4" fill="#E7E1F5"/>
    <rect x="40" y="228" width="260" height="10" rx="4" fill="#E7E1F5"/>

    <!-- dashed placeholder row = the missing listing -->
    <rect x="40" y="268" width="520" height="46" rx="10" fill="none" stroke="#B79CE0" stroke-width="2" stroke-dasharray="6 7"/>
    <text x="60" y="296" font-family="Poppins, sans-serif" font-size="15" font-weight="600" fill="#6300CD">Your website should be here</text>
  </g>

  <!-- large magnifying glass, teal accent -->
  <g transform="translate(760,80)">
    <circle cx="90" cy="90" r="70" fill="none" stroke="url(#accentGrad)" stroke-width="16"/>
    <line x1="140" y1="140" x2="205" y2="205" stroke="url(#accentGrad)" stroke-width="18" stroke-linecap="round"/>
    <path d="M55 90 a35 35 0 0 1 35 -35" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  </g>

  <text x="90" y="80" font-family="Poppins, sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#00E0C6">SEO &amp; GOOGLE INDEXING</text>
  <text x="90" y="580" font-family="Poppins, sans-serif" font-size="17" font-weight="600" fill="#FFFFFF" opacity="0.85">wachsaif.github.io</text>
</svg>
